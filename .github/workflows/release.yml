name: Release

on:
  push:
    tags: ['v*']
  # Dispatch = dry-run validator: the whole release path runs, only the
  # publish step is tag-gated. No throwaway tag needed.
  workflow_dispatch:

# Never cancel a release mid-publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Guard against tagging a commit whose project() version disagrees
      # with the tag — the CLI banner shipped three releases reporting
      # v1.2.0 because nothing checked this. Runs FIRST so a mismatched
      # tag fails in seconds, not after a two-hour vendored build.
      - name: Verify tag matches project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          V=$(sed -n 's/^project(vmavificient VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match project VERSION $V"
            exit 1
          fi

      - uses: ./.github/actions/setup-build
        with:
          mode: vendored
          deps-path: build/deps
          deps-cache-key: cmake-deps-static-macos-arm64-${{ hashFiles('CMakeLists.txt') }}

      # VMAV_GRAV1SYNTH_BIN_RUNTIME is load-bearing for a release build.
      # Without it the absolute build path is compiled in, which on a runner
      # means /Users/runner/work/... — a path that exists nowhere else. Every
      # release up to and including v2.2.0 shipped that way, so grain
      # analysis failed with ENOENT on every downloaded binary. A bare
      # command name makes posix_spawnp fall back to PATH, which is why
      # grav1synth is shipped beside it below.
      - name: Configure (vendored static)
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DVMAV_USE_SYSTEM_DEPS=OFF \
            -DVMAV_GRAV1SYNTH_BIN_RUNTIME=grav1synth

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)

      # Tags land on commits already validated by ci.yml on main, but the
      # release binary is a different build (static, vendored) — sanity-
      # check it directly.
      - name: Run unit tests
        run: ./build/vmav_tests

      - name: Verify version banner
        run: ./build/vmavificient --help | head -1

      # Component-scoped: a plain install also runs cJSON's rules, which
      # write to an absolute prefix fixed at configure time and fail.
      - name: Install to a staging tree
        run: |
          cmake --install build --prefix "$GITHUB_WORKSPACE/stage" \
            --component vmavificient
          chmod +x "$GITHUB_WORKSPACE/stage/bin/"*
          ls -l "$GITHUB_WORKSPACE/stage/bin/"

      # Regression test for the bug this workflow shipped up to v2.2.0: if an
      # absolute grav1synth path is baked in, the released binary cannot
      # spawn it and grain analysis dies with ENOENT on every user machine.
      - name: Verify grav1synth resolves via PATH
        run: |
          if strings stage/bin/vmavificient | grep -qE '/[^ ]*/grav1synth'; then
            echo "::error::an absolute grav1synth path is compiled in — it will not exist on a user machine"
            strings stage/bin/vmavificient | grep -E '/[^ ]*/grav1synth' | head -3
            exit 1
          fi
          stage/bin/grav1synth --version
          echo "grav1synth is shipped and resolved by name"

      # Both binaries travel together: vmavificient spawns grav1synth by
      # name, so it has to be on PATH. The bare binary is kept as a separate
      # asset for packagers who already provide grav1synth themselves.
      - name: Package archive + checksums
        run: |
          VERSION=$(sed -n 's/^project(vmavificient VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          mkdir -p dist
          tar -czf "dist/vmavificient-${VERSION}-macos-arm64.tar.gz" -C stage bin
          cp stage/bin/vmavificient dist/vmavificient-macos-arm64
          chmod +x dist/vmavificient-macos-arm64
          cd dist
          shasum -a 256 vmavificient-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          generate_release_notes: true
